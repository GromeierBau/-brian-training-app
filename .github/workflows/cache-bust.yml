name: One-shot app cache bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app asset versions
        run: |
          sed -i 's#src="mcdonalds-official.js"#src="mcdonalds-official.js?v=20260811-2014"#' index.html
          sed -i 's#smart-home.js?v=20260811-2#smart-home.js?v=20260811-7d68d4b#' mcdonalds-official.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mcdonalds-official.js
          git diff --cached --quiet && exit 0
          git commit -m "Bust Safari cache for barcode scanner"
          git push
